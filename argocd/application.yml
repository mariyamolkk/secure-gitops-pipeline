apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secure-gitops-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/mariyamolkk/secure-gitops-pipeline.git
    targetRevision: main
    path: kubernetes/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: secure-gitops

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true