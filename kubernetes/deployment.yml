apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-gitops-app
  namespace: secure-gitops
  labels:
    app: secure-gitops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secure-gitops-app
  template:
    metadata:
      labels:
        app: secure-gitops-app
    spec:
      containers:
        - name: secure-gitops-app
          image: secure-gitops-app:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10